<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B5CFF"><link rel="manifest" href="./manifest.webmanifest?v=112"><link rel="apple-touch-icon" href="./icon-192.png?v=112"><title>基金从业刷题</title><style>
:root{--b:#0b5cff;--bg:#f5f7fb;--card:#fff;--t:#182033;--s:#7b8497;--line:#e8edf5;--ok:#169b68;--bad:#e5484d;--gold:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--t)}button{font:inherit}.app{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 15px 100px;min-height:100vh}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h1{font-size:23px;margin:0}.badge,.pill{font-size:11px;background:#eaf1ff;color:var(--b);padding:5px 9px;border-radius:99px}.hero{padding:19px;border-radius:22px;background:linear-gradient(135deg,#0759ff,#4b8cff);color:#fff;box-shadow:0 12px 28px #0b5cff20}.hero strong{display:block;font-size:28px;margin:5px 0}.bar,.pbar{height:7px;background:#ffffff35;border-radius:9px;overflow:hidden}.bar i,.pbar i{display:block;height:100%;background:white}.sec{font-size:14px;color:var(--s);margin:20px 3px 9px}.subjects,.grid2,.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}.subject,.tile,.card{border:0;background:white;border-radius:18px;padding:15px;text-align:left;box-shadow:0 5px 20px #1720330a}.subject.active{outline:2px solid var(--b)}.subject b{font-size:17px}.subject span,.muted{display:block;color:var(--s);font-size:12px;margin-top:5px;line-height:1.45}.tile b{display:block;font-size:15px}.tile span{font-size:12px;color:var(--s);display:block;margin-top:5px}.week{width:100%;margin:8px 0}.weekTop{display:flex;justify-content:space-between;gap:10px}.week h3{font-size:16px;margin:0}.pbar{background:#edf1f7;margin-top:12px}.pbar i{background:var(--b)}.qmeta{display:flex;justify-content:space-between;color:var(--s);font-size:12px}.q{font-size:18px;font-weight:700;line-height:1.55;margin:15px 0}.opt{width:100%;padding:14px;margin:7px 0;text-align:left;border:1px solid var(--line);border-radius:14px;background:white}.opt.sel{border-color:var(--b);background:#eef4ff}.opt.ok{border-color:var(--ok);background:#effbf6}.opt.bad{border-color:var(--bad);background:#fff2f2}.analysis{padding:14px;background:#f7f9fc;border-radius:14px;margin-top:14px;line-height:1.65;font-size:14}.analysis b{color:var(--b)}.actions{display:flex;gap:8px;margin-top:12px}.actions button,.full{flex:1;border:0;border-radius:13px;padding:13px;font-weight:700}.primary{background:var(--b);color:white}.plain{background:#eef2f7;color:var(--t)}.focus.on{background:#fff7e6;color:#b76e00}.hide{display:none!important}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#ffffffee;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 4px calc(env(safe-area-inset-bottom) + 8px);z-index:9}.tabs button{border:0;background:none;padding:8px 2px;font-size:11px;color:var(--s)}.tabs .on{color:var(--b);font-weight:700}.empty{text-align:center;padding:36px 15px;color:var(--s)}.statrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.timer{font-weight:800;color:var(--bad)}.score{font-size:30px;font-weight:800}.danger{color:var(--bad)}.oktxt{color:var(--ok)}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tag{font-size:10px;padding:3px 7px;border-radius:99px;background:#f0f3f8;color:#657087}.tag.hot{background:#fff3df;color:#ad6900}.notice{font-size:12px;line-height:1.6;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--s);margin-top:10px}
</style></head><body><div class="app"><div class="head"><h1>基金从业刷题</h1></div>
<main id="home"><div class="hero"><small>2026 科目一 + 科目三</small><strong id="overall">0 / 1600</strong><div class="bar"><i id="overallbar"></i></div><div id="accuracy" style="font-size:12px;margin-top:10px"></div></div><div class="notice">按 2026 年修订考试大纲方向组织训练；V1.1 强化题库结构检查、重点分层和错题优先。题目均为原创模拟练习题，不冒充官方真题。正式考试：单科 100 题、120 分钟、60 分合格。</div><div class="sec">考试科目</div><div class="subjects"><button id="s1btn" class="subject active" onclick="pickSubject('s1')"><b>科目一</b><span>基金基础知识与法律法规</span></button><button id="s3btn" class="subject" onclick="pickSubject('s3')"><b>科目三</b><span>私募股权投资基金基础知识</span></button></div><div class="sec">应试训练</div><div class="grid2"><button class="tile" onclick="startDaily()"><b>今日 50 题</b><span id="dailyText">优先未做题</span></button><button class="tile" onclick="startHot()"><b>高频 · 易错</b><span>重点考点强化</span></button><button class="tile" onclick="startFocus()"><b>我的重点题</b><span id="focusText">0 道重点题</span></button><button class="tile" onclick="startUnseen()"><b>未做题专项</b><span id="unseenText">覆盖全部题库</span></button><button class="tile" onclick="startQuality()"><b>题库质量中心</b><span>章节覆盖 · 重复检测 · 重点分布</span></button><button class="tile" onclick="startMistakeFocus()"><b>错题优先 50</b><span>错题 + 薄弱考点优先</span></button></div><div class="sec">每周学习计划</div><div id="weeks"></div></main>
<main id="quiz" class="hide"><div class="card"><div class="qmeta"><span id="qpos"></span><span><span id="qweek"></span> <span id="timer" class="timer"></span></span></div><div id="qtags" class="tags"></div><div class="q" id="qtext"></div><div id="opts"></div><div id="analysis" class="analysis hide"></div><div class="actions"><button id="focus" class="plain focus">☆ 标记重点</button><button id="submit" class="primary">提交答案</button></div><div class="actions"><button id="prev" class="plain">上一题</button><button id="next" class="primary">下一题</button></div></div></main>
<main id="wrong" class="hide"><div class="card"><b>错题本</b><span class="muted">答错自动收录；重刷连续答对 2 次后自动移出。</span><button class="primary full" style="width:100%;margin-top:12px" onclick="startWrong()">开始重刷错题</button></div><div id="wronglist"></div></main>
<main id="mock" class="hide"><div class="card"><h3 style="margin-top:0">正式模拟考试</h3><div class="muted">100题 · 120分钟 · 60分合格 · 随机组卷</div><div class="grid2" style="margin-top:12px"><button class="tile" onclick="startMock('s1')"><b>科目一模考</b><span>100题</span></button><button class="tile" onclick="startMock('s3')"><b>科目三模考</b><span>100题</span></button></div></div><div class="sec">最近模考</div><div id="history"></div></main>
<main id="quality" class="hide"><div class="card"><h3 style="margin-top:0">题库质量中心</h3><span class="muted">基于当前原创模拟题库的结构检查；不代表官方真题认证。</span><div id="qualityBody"></div></div><div class="card"><h3 style="margin-top:0">章节覆盖</h3><div id="coverage"></div></div></main><main id="stats" class="hide"><div class="card"><h3 style="margin-top:0">学习统计</h3><div id="statbody"></div></div><div class="card"><h3 style="margin-top:0">薄弱知识点 TOP 5</h3><div id="weak"></div></div></main></div>
<nav class="tabs"><button class="on" onclick="go('home',this)">首页</button><button onclick="startRandom()">随机</button><button onclick="go('wrong',this)">错题</button><button onclick="go('mock',this)">模考</button><button onclick="go('stats',this)">统计</button></nav><script src="./questions.js?v=112"></script><script>
const $ = (id) => document.getElementById(id);
const overall=$('overall'), overallbar=$('overallbar'), accuracy=$('accuracy'),
dailyText=$('dailyText'), focusText=$('focusText'), unseenText=$('unseenText'),
weeks=$('weeks'), s1btn=$('s1btn'), s3btn=$('s3btn'), timer=$('timer'),
qpos=$('qpos'), qweek=$('qweek'), qtags=$('qtags'), qtext=$('qtext'),
opts=$('opts'), analysis=$('analysis'), submit=$('submit'), prev=$('prev'),
next=$('next'), focus=$('focus'), wronglist=$('wronglist'), history=$('history'),
statbody=$('statbody'), weak=$('weak'), qualityBody=$('qualityBody'), coverage=$('coverage');
let bank=window.QUESTIONS||[];if(!bank.length){document.body.innerHTML='<div style="font-family:-apple-system;padding:24px;line-height:1.7"><h2>题库加载失败</h2><p>questions.js 未成功载入，请刷新页面。</p></div>';throw new Error('questions.js load failed')}let sub='s1',session=[],idx=0,sel=null,done=false,mode='practice',mockCorrect=0,timerInt=null,endAt=0;
let S;try{S=JSON.parse(localStorage.getItem('fund_v1')||'null')}catch(e){S=null}
S=S||{answered:{},wrong:{},wrongMastery:{},focus:{},correct:0,attempts:0,byKey:{},history:[],daily:{date:'',count:0}};
const save=()=>{try{localStorage.setItem('fund_v1',JSON.stringify(S))}catch(e){}};
function go(id,btn){if(id!=='quiz')clearInterval(timerInt);['home','quiz','wrong','mock','quality','stats'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));if(btn)btn.classList.add('on');if(id==='home')renderHome();if(id==='wrong')renderWrong();if(id==='mock')renderMock();if(id==='quality')renderQuality();if(id==='stats')renderStats()}
function pickSubject(s){sub=s;s1btn.classList.toggle('active',s==='s1');s3btn.classList.toggle('active',s==='s3');renderHome()}
function today(){return new Date().toISOString().slice(0,10)}function dailyReset(){if(S.daily.date!==today())S.daily={date:today(),count:0}}
function renderHome(){dailyReset();let sb=bank.filter(q=>q.subject===sub),n=sb.filter(q=>S.answered[q.id]).length;overall.textContent=n+' / '+sb.length;overallbar.style.width=(n/sb.length*100)+'%';accuracy.textContent='本科正确率 '+subjectAcc(sub)+'% · 错题 '+sb.filter(q=>S.wrong[q.id]).length+' · 重点 '+sb.filter(q=>S.focus[q.id]).length;dailyText.textContent=`今日已完成 ${S.daily.count}/50`;focusText.textContent=sb.filter(q=>S.focus[q.id]).length+' 道重点题';unseenText.textContent=sb.filter(q=>!S.answered[q.id]).length+' 道未做';renderWeeks();save()}
function subjectAcc(s){let keys=Object.entries(S.byKey).filter(([k,v])=>v.subject===s),a=keys.reduce((x,[k,v])=>x+v.a,0),c=keys.reduce((x,[k,v])=>x+v.c,0);return a?Math.round(c/a*100):0}
function renderWeeks(){let arr=bank.filter(q=>q.subject===sub),ws=[...new Map(arr.map(q=>[q.week,q.weekTitle])).entries()];weeks.innerHTML=ws.map(([w,t])=>{let q=arr.filter(x=>x.week===w),d=q.filter(x=>S.answered[x.id]).length,p=Math.round(d/q.length*100),hot=q.filter(x=>x.priority==='重点').length;return `<button class="card week" onclick="startWeek(${w})"><div class="weekTop"><div><h3>${t}</h3><div class="muted">${q.length}题 · 高频/易错 ${hot}题 · 已完成 ${d}题</div></div><b>${p}%</b></div><div class="pbar"><i style="width:${p}%"></i></div></button>`}).join('')}
function startSet(a,m='practice'){if(!a.length)return alert('当前没有可练习题目');session=a;idx=0;mode=m;mockCorrect=0;openQuiz()}
function startWeek(w){startSet(bank.filter(q=>q.subject===sub&&q.week===w))}function startRandom(){startSet(shuffle(bank.filter(q=>q.subject===sub).slice()).slice(0,20))}function startDaily(){dailyReset();let left=Math.max(1,50-S.daily.count),a=bank.filter(q=>q.subject===sub&&!S.answered[q.id]);if(a.length<left)a=bank.filter(q=>q.subject===sub);startSet(shuffle(a).slice(0,left),'daily')}function startHot(){startSet(shuffle(bank.filter(q=>q.subject===sub&&q.priority==='重点')).slice(0,100),'hot')}function startFocus(){startSet(shuffle(bank.filter(q=>q.subject===sub&&S.focus[q.id])).slice(0,100))}function startUnseen(){startSet(shuffle(bank.filter(q=>q.subject===sub&&!S.answered[q.id])).slice(0,100))}function startWrong(){startSet(shuffle(bank.filter(q=>q.subject===sub&&S.wrong[q.id])),'wrong')}
function startMock(s){sub=s;startSet(shuffle(bank.filter(q=>q.subject===s)).slice(0,100),'mock');endAt=Date.now()+120*60*1000;startTimer()}
function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{let d=Math.max(0,endAt-Date.now()),m=Math.floor(d/60000),ss=Math.floor(d%60000/1000);timer.textContent=`${m}:${String(ss).padStart(2,'0')}`;if(!d)finishMock()},1000)}
function openQuiz(){go('quiz');renderQ();if(mode==='mock')startTimer()}
function renderQ(){done=false;sel=null;let q=session[idx];qpos.textContent=`${idx+1} / ${session.length}`;qweek.textContent=(q.subject==='s1'?'科目一':'科目三')+' · 第'+q.week+'周';qtags.innerHTML=`<span class="tag ${q.priority==='重点'?'hot':''}">${q.type}</span><span class="tag">${q.keypoint}</span>`;qtext.textContent=q.title;opts.innerHTML=q.options.map((o,i)=>`<button class="opt" onclick="choose(${i})"><b>${'ABCD'[i]}.</b> ${o}</button>`).join('');analysis.classList.add('hide');submit.classList.remove('hide');prev.disabled=idx===0;prev.style.opacity=idx===0?'.45':'1';next.textContent=idx===session.length-1?'完成':'下一题';focus.textContent=S.focus[q.id]?'★ 已标重点':'☆ 标记重点';focus.classList.toggle('on',!!S.focus[q.id])}
function choose(i){if(done)return;sel=i;[...opts.children].forEach((x,j)=>x.classList.toggle('sel',j===i))}
submit.onclick=()=>{if(sel===null)return alert('请先选择答案');let q=session[idx],ok=sel===q.answer;done=true;S.attempts++;S.answered[q.id]=1;S.byKey[q.keypoint]=S.byKey[q.keypoint]||{a:0,c:0,subject:q.subject};S.byKey[q.keypoint].a++;if(ok){S.correct++;S.byKey[q.keypoint].c++;if(mode==='mock')mockCorrect++;if(S.wrong[q.id]){S.wrongMastery[q.id]=(S.wrongMastery[q.id]||0)+1;if(S.wrongMastery[q.id]>=2){delete S.wrong[q.id];delete S.wrongMastery[q.id]}}}else{S.wrong[q.id]=1;S.wrongMastery[q.id]=0}if(mode==='daily'){dailyReset();S.daily.count++}save();[...opts.children].forEach((x,j)=>{x.classList.remove('sel');if(j===q.answer)x.classList.add('ok');else if(j===sel)x.classList.add('bad')});analysis.innerHTML=`<b>${ok?'回答正确':'回答错误'}</b><br>正确答案：${'ABCD'[q.answer]}<br><b>考点：</b>${q.keypoint}<br><b>解析：</b>${q.explain}${!ok?'<br><b>已自动加入错题本</b>':''}`;analysis.classList.remove('hide');submit.classList.add('hide');if(ok){setTimeout(()=>{if(idx<session.length-1){idx++;renderQ()}else if(mode==='mock'){finishMock()}else{alert('本组练习完成');go('home')}},420)}}
prev.onclick=()=>{if(idx>0){idx--;renderQ()}};next.onclick=()=>{if(idx<session.length-1){idx++;renderQ()}else mode==='mock'?finishMock():(alert('本组练习完成'),go('home'))};focus.onclick=()=>{let q=session[idx];S.focus[q.id]?delete S.focus[q.id]:S.focus[q.id]=1;save();focus.textContent=S.focus[q.id]?'★ 已标重点':'☆ 标记重点';focus.classList.toggle('on',!!S.focus[q.id])}
function finishMock(){clearInterval(timerInt);if(mode!=='mock')return;let score=mockCorrect;S.history.unshift({date:new Date().toLocaleString(),subject:(session[0]&&session[0].subject)||sub,score});S.history=S.history.slice(0,20);save();mode='done';alert(`模拟考试结束：${score}分 · ${score>=60?'合格':'未合格'}`);go('mock')}
function renderWrong(){let a=bank.filter(q=>q.subject===sub&&S.wrong[q.id]);wronglist.innerHTML=a.length?a.slice(0,100).map(q=>`<div class="card"><b>${q.title}</b><div class="muted">${q.keypoint} · ${q.type} · 掌握 ${S.wrongMastery[q.id]||0}/2</div></div>`).join(''):'<div class="empty">当前科目暂无错题</div>'}
function renderMock(){history.innerHTML=S.history.length?S.history.map(h=>`<div class="card"><div class="weekTop"><div><b>${h.subject==='s1'?'科目一':'科目三'}</b><span class="muted">${h.date}</span></div><div class="score ${h.score>=60?'oktxt':'danger'}">${h.score}</div></div></div>`).join(''):'<div class="empty">还没有模考记录</div>'}
function renderStats(){let a=S.attempts?Math.round(S.correct/S.attempts*100):0;statbody.innerHTML=`<div class="statrow"><span>累计答题</span><b>${S.attempts}</b></div><div class="statrow"><span>总正确率</span><b>${a}%</b></div><div class="statrow"><span>科目一覆盖</span><b>${bank.filter(q=>q.subject==='s1'&&S.answered[q.id]).length}/800</b></div><div class="statrow"><span>科目三覆盖</span><b>${bank.filter(q=>q.subject==='s3'&&S.answered[q.id]).length}/800</b></div><div class="statrow"><span>错题</span><b>${Object.keys(S.wrong).length}</b></div><div class="statrow"><span>重点题</span><b>${Object.keys(S.focus).length}</b></div>`;let w=Object.entries(S.byKey).filter(x=>x[1].a>=2).map(([k,v])=>[k,Math.round(v.c/v.a*100),v.a]).sort((a,b)=>a[1]-b[1]).slice(0,5);weak.innerHTML=w.length?w.map(x=>`<div class="statrow"><span>${x[0]} <small class="muted">${x[2]}题</small></span><b class="${x[1]<60?'danger':''}">${x[1]}%</b></div>`).join(''):'<div class="muted">完成更多练习后生成薄弱点排行</div>'}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}try{renderHome()}catch(e){
  console.error(e);
  document.body.innerHTML='<div style="font-family:-apple-system;padding:24px;line-height:1.7"><h2>页面初始化失败</h2><p>'+String(e.message||e)+'</p><p>请截图此错误信息。</p></div>';
}
if('serviceWorker'in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){});
}
if(window.caches&&caches.keys){caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k)})}).catch(function(){});}
</script></body></html>
